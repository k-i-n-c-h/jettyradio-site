name: Deploy Jetty website and desk

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jetty-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      desk_configured: ${{ steps.desk-config.outputs.configured }}
    env:
      AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
      PUBLIC_DESK_API_URL: ${{ vars.PUBLIC_DESK_API_URL }}
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Check desk deployment configuration
        id: desk-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_ALLOWED_USER_IDS: ${{ vars.CLERK_ALLOWED_USER_IDS }}
        run: |
          missing=()
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLERK_ALLOWED_USER_IDS PUBLIC_DESK_API_URL; do
            if [[ -z "${!required//[[:space:]]/}" ]]; then
              missing+=("$required")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping desk deployment until these GitHub Actions settings are configured: ${missing[*]}. The website will still deploy."
            echo "Desk deployment skipped: missing ${missing[*]}. Website deployment can proceed; the existing Worker is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, build, and upload your site
        uses: withastro/action@v5

  deploy-desk:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.desk_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desk-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desk-worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --test src/*.test.mjs
      - name: Deploy desk Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_ALLOWED_USER_IDS: ${{ vars.CLERK_ALLOWED_USER_IDS }}
          PUBLIC_DESK_API_URL: ${{ vars.PUBLIC_DESK_API_URL }}
        run: |
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLERK_ALLOWED_USER_IDS PUBLIC_DESK_API_URL; do
            if [[ -z "${!required//[[:space:]]/}" ]]; then
              echo "::error::Configure $required in GitHub Actions settings before deploying."
              exit 1
            fi
          done
          npm run deploy -- --var "CLERK_ALLOWED_USER_IDS:$CLERK_ALLOWED_USER_IDS"

  deploy:
    needs: [build, deploy-desk]
    # Allow the website through only when the Worker succeeded or was intentionally
    # skipped for missing configuration. Actual deployment failures still block it.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          needs.build.result == 'success' &&
          (needs.deploy-desk.result == 'success' ||
           (needs.deploy-desk.result == 'skipped' && needs.build.outputs.desk_configured == 'false')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
